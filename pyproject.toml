[project]
name = "krisis"
version = "0.1.0"
description = "Windows Registry Corruption Detector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
check-registry = "krisis.check_registry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krisis"]
